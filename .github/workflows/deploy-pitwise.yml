name: Deploy PitWise na Cloudflare Pages

# Spusti se pri kazde zmene webu pitwise/ (auto-deploy) nebo rucne z tlacitka.
on:
  push:
    branches: [main]
    paths:
      - 'pitwise/**'
      - '.github/workflows/deploy-pitwise.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Stahnout repo
        uses: actions/checkout@v4

      - name: Nasadit na Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # bezet PRIMO ve slozce pitwise/ - wrangler hleda functions/ v pracovnim adresari,
          # takze "pages deploy pitwise" by nasadil web BEZ funkci (/api/update, /api/feedback)
          workingDirectory: pitwise
          # --branch=main => produkce (pitwise.net)
          command: pages deploy . --project-name=pitwise --branch=main
