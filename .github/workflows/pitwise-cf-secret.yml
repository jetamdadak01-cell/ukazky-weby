name: PitWise - zapsat tajemstvi do Cloudflare Pages

# Jednorazovy nastroj: zapise SECRET do produkcniho prostredi Pages projektu "pitwise", aniz by kdokoli
# musel do Cloudflare dashboardu. Hodnota se bere z GitHub secretu (repo je VEREJNE - do souboru nikdy).
# Pouziti: Actions > tento workflow > Run workflow > jmeno promenne + jmeno GitHub secretu, kde je hodnota.
# POZOR: Pages nacita promenne az pri NOVEM nasazeni - po tomhle workflow spustit "Deploy PitWise".
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Jmeno promenne v Cloudflare (napr. INGEST_TOKEN)'
        required: true
        type: string
      from_secret:
        description: 'Jmeno GitHub secretu, ze ktereho se vezme hodnota (napr. PITWISE_INGEST_TOKEN)'
        required: true
        type: string

jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Zapsat secret pres wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          VAR_NAME: ${{ inputs.name }}
          FROM: ${{ inputs.from_secret }}
        run: |
          set -e
          case "$VAR_NAME" in *[!A-Z0-9_]*|"") echo "::error::neplatne jmeno promenne"; exit 1;; esac
          VALUE=$(echo "$ALL_SECRETS" | jq -r --arg k "$FROM" '.[$k] // empty')
          if [ -z "$VALUE" ]; then echo "::error::GitHub secret '$FROM' neexistuje nebo je prazdny"; exit 1; fi
          # wrangler cte hodnotu ze stdin; hodnota se nikdy nevypisuje (GitHub ji navic maskuje)
          printf '%s' "$VALUE" | npx --yes wrangler@3 pages secret put "$VAR_NAME" --project-name pitwise
          echo "zapsano: $VAR_NAME (produkce projektu pitwise)"
