name: PitWise - INGEST_TOKEN do Cloudflare Pages

# Jednorazovy nastroj: zapise INGEST_TOKEN do PRODUKCNIHO prostredi Pages projektu "pitwise", aniz by
# kdokoli musel do Cloudflare dashboardu. Hodnota = GitHub secret PITWISE_INGEST_TOKEN (repo je VEREJNE,
# takze hodnota nikdy nesmi do tohoto souboru). Pevne mapovani zamerne: prvni verze s dynamickym
# vyberem secretu pres toJSON(secrets) skoncila jako "action_required" bez jedineho jobu.
# POZOR: Pages nacita promenne az pri NOVEM nasazeni - po tomhle workflow spustit "Deploy PitWise".
on:
  workflow_dispatch:

jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Zapsat INGEST_TOKEN pres wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.PITWISE_INGEST_TOKEN }}
        run: |
          set -e
          if [ -z "$VALUE" ]; then echo "::error::GitHub secret PITWISE_INGEST_TOKEN je prazdny"; exit 1; fi
          # wrangler bere hodnotu ze stdin; nikam se nevypisuje (GitHub ji navic maskuje)
          printf '%s' "$VALUE" | npx --yes wrangler@3 pages secret put INGEST_TOKEN --project-name pitwise
          echo "zapsano: INGEST_TOKEN (produkce projektu pitwise)"
